services:
  api:
    build: .
    image: leo-activation:latest
    container_name: my_running_api
    ports:
      # SECURE BINDING: Only Nginx (or host-level tools) can talk to the API
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - ARANGO_HOST=${ARANGO_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: my_redis_cache
    restart: unless-stopped
    ports:
    - "6379:6379"
    # SECURITY FIX: No 'ports' section here! 
    # Redis is completely invisible to the outside world.

  ngrok:
    image: ngrok/ngrok:latest
    container_name: my_ngrok_tunnel
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Pulls your auth token securely from the same .env file
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    # Ngrok uses Docker's internal DNS to route directly to the 'api' service!
    # PRO-TIP: Add your free static domain here so the Zalo webhook never breaks.
    command: "http api:8000 --domain=kirby-nonclarifiable-nonembryonically.ngrok-free.dev"
    ports:
      # SECURE BINDING: Exposes the Ngrok X-Ray dashboard only to the local server
      - "127.0.0.1:4040:4040"
  celery-worker:
    image: leo-activation:latest
    command: celery -A data_workers.celery_app.worker worker --loglevel=info
    env_file: .env
    environment:
      - CELERY_REDIS_URL=redis://redis:6379/1
      - CDC_REDIS_URL=redis://redis:6379/2
      - ARANGO_HOST=${ARANGO_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  celery-beat:
    image: leo-activation:latest
    command: celery -A data_workers.celery_app.worker beat --loglevel=info
    env_file: .env
    environment:
      - CELERY_REDIS_URL=redis://redis:6379/1
      - CDC_REDIS_URL=redis://redis:6379/2
      - ARANGO_HOST=${ARANGO_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped

  # ============================================================
  # Real-Time CDC Pipeline
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: my_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: my_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  cdc-poller:
    build:
      context: .
      dockerfile: services/cdc_poller/Dockerfile
    container_name: my_cdc_poller
    env_file: .env
    environment:
      - ARANGO_HOST=${ARANGO_HOST}
      - ARANGO_RAW_HOST=${ARANGO_RAW_HOST:-${ARANGO_HOST}}
      - ARANGO_RAW_PORT=${ARANGO_RAW_PORT:-8529}
      - ARANGO_DB=${ARANGO_DB:-leo_cdp_source}
      - REDIS_URL=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REALTIME_SCORING_ENABLED=${REALTIME_SCORING_ENABLED:-False}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  scoring-consumer:
    build:
      context: .
      dockerfile: services/scoring_consumer/Dockerfile
    container_name: my_scoring_consumer
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ARANGO_HOST=${ARANGO_HOST}
      - REALTIME_SCORING_ENABLED=${REALTIME_SCORING_ENABLED:-False}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  nba-publisher:
    build:
      context: .
      dockerfile: services/nba_publisher/Dockerfile
    container_name: my_nba_publisher
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ARANGO_HOST=${ARANGO_HOST}
      - REALTIME_SCORING_ENABLED=${REALTIME_SCORING_ENABLED:-False}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  ws-forwarder:
    build:
      context: .
      dockerfile: services/ws_forwarder/Dockerfile
    container_name: my_ws_forwarder
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WS_FORWARDER_URL=${WS_FORWARDER_URL:-wss://think-uat.innotech.vn/assistant/ws/event/stream}
      - WS_CLIENT_ID=${WS_CLIENT_ID:-cdp_innotech_2026}
      - WS_FORWARDER_INPUT_TOPIC=${WS_FORWARDER_INPUT_TOPIC:-leo.score.updates}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
    restart: unless-stopped